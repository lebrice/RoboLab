[project]
name = "robolab"
version = "0.3.2"
description = "A benchmark for simulation"
readme = "README.md"
# This branch targets IsaacLab 3.0 / IsaacSim 6.2 only, which only support Python 3.12.
requires-python = "==3.12.*"
license = {text = "Apache-2.0"}
authors = [{name = "Xuning Yang"}]
dependencies = [
    # Core
    # IsaacLab + IsaacSim come from the `isaac62` extra below:
    #   uv sync --extra isaac62   # IsaacLab 3.0.0 / IsaacSim 6.2.0
    # (Upstream's isaac50 / isaac51 extras are gone on this branch: the code now uses
    # IsaacLab 3.0's APIs and its xyzw quaternion order.)
    "torch",
    "numpy",
    "gymnasium",
    # Remote inference
    "openai",
    "requests",
    "json_numpy",
    "pyzmq",
    "msgpack",
    "msgpack-numpy",
    "websockets",
    # Computer vision and image processing
    "opencv-python",
    "Pillow",
    "imageio",
    # Scientific computing
    "scipy",
    "matplotlib",
    # Data handling
    "h5py",
    "PyYAML",
    "pandas",
    # Misc
    "tqdm",
    "tyro",
    "python-dotenv",
    "setuptools<81",
    # Dashboard (robolab-dashboard CLI); kept in the default install since
    # the runtime footprint is small and most users want it available.
    "fastapi",
    "uvicorn[standard]",
    "jinja2",
]

[project.optional-dependencies]
isaac62 = [
    "isaaclab[isaacsim]==3.0.0",
    "isaacsim[all,extscache]==6.2.0",
]
analysis = ["sbi"]
# httpx: not used directly, but starlette.testclient.TestClient (used by the
# dashboard's route tests) hard-requires it at import time. Previously only
# ever present incidentally via other extras' transitive deps.
test = ["pytest", "httpx"]
all = ["sbi", "pytest"]

[project.scripts]
robolab-dashboard = "dashboard.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["robolab", "robolab.*", "policies", "policies.*", "dashboard", "dashboard.*"]
exclude = ["policies.ai_native.dev", "policies.ai_native.dev.*", "policies.ai_native.*.dev", "policies.ai_native.*.dev.*"]

[tool.setuptools.package-data]
dashboard = ["templates/*.html", "static/*"]

# -- uv configuration --

[tool.uv]
prerelease = "allow"
index-strategy = "unsafe-best-match"
# IsaacLab 3.0's own overrides of IsaacSim 6.2's older exact pins (copied from IsaacLab
# v3.0.0's pyproject.toml). Overrides replace a package's requirements for every requester.
override-dependencies = [
    "numpy>=2",
    "mujoco~=3.12.0",
    "mujoco-warp~=3.12.0",
    "newton[sim]==1.6.1",
    "newton-usd-schemas>=0.5.0",
    "usd-exchange==3.0.1",
    "usd-optimize~=1.3.1",
    "torch==2.11.0",
    "torchvision==0.26.0",
    "fsspec>=2026.6.0",
    "packaging>=20,<27",
    "urllib3>=2.8.0",
]
# warp-lang 1.13.0.dev20260418 on pypi.nvidia.com only published the macOS
# wheel — no Linux build — so any resolver pass that picked it would break
# `uv sync` on Linux. Exclude that specific version.
constraint-dependencies = ["warp-lang != 1.13.0.dev20260418"]

[tool.uv.extra-build-dependencies]
# flatdict 4.0.1 ships sdist-only and its legacy setup.py needs an older
# setuptools plus `wheel` to build. Building in an isolated PEP 517 env
# (i.e. NOT in `no-build-isolation-package`) lets these deps apply
# deterministically regardless of what's in the project venv.
flatdict = ["setuptools<81", "wheel"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"

[[tool.uv.index]]
name = "pypi-public"
url = "https://pypi.org/simple"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
# As in IsaacLab 3.0: these come from PyPI rather than pypi.nvidia.com.
omniverseclient = { index = "pypi-public" }
ovphysx = { index = "pypi-public" }
ovrtx = { index = "pypi-public" }
ovstage = { index = "pypi-public" }

[tool.pytest.ini_options]
testpaths = ["tests", "dashboard/tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["robolab", "policies"]
known-third-party = ["isaaclab", "isaaclab_assets", "isaaclab_mimic", "isaaclab_rl", "isaaclab_tasks"]
